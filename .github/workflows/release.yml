#
# Tag-triggered release: vX.Y.Z -> Windows NSIS installer + Linux tarball (per-user) + Linux .deb
# (system-wide) attached to the GitHub Release. Builds here are unsigned; signed releases come from the signing provider
# (the runtime's docs/specs/runtime/release-signing.md, driven by `/dxr-release
# open-conversion`), which rebuilds the tag with SIGN_CMD and replaces the unsigned Windows
# installer. The ordinary `build` workflow already runs every test on each push; this lane
# only builds and packages.

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENCONV_BUILD_TESTS=OFF -DOPENCONV_DOWNLOAD_DIR="${{ github.workspace }}/downloads"
      - name: Build
        run: cmake --build build
      - name: Install tree
        run: cmake --install build --prefix dist
      - name: NSIS
        run: choco install nsis -y --no-progress
      # ADR-054 N4b: the runtime's provenance gate enforces on Windows and these builds are
      # unsigned, so the installer must carry the SHA-256 of the DLL it ships (allowlist row).
      - name: Allowlist row for the unsigned provider DLL
        shell: pwsh
        run: |
          cmake "-DBIN_DIR=$PWD\dist" "-DVERSION=$env:VERSION" "-DOUT=$PWD\build\Allowlist.nsh" -P installer\gen_allowlist_nsh.cmake
          if ($LASTEXITCODE -ne 0) { throw "gen_allowlist_nsh failed" }
          Get-Content build\Allowlist.nsh
      - name: Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 "/DVERSION=$env:VERSION" "/DDIST_DIR=$PWD\dist" "/DOUTPUT_DIR=$PWD\out" "/DALLOWLIST_NSH=$PWD\build\Allowlist.nsh" installer\DisplayXROpenConversionInstaller.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/DisplayXROpenConversionSetup-*.exe
          if-no-files-found: error

  # Built in an ubuntu:22.04 container (the oldest supported release): the tarball and the
  # .deb carry the build host's glibc floor, and both must run on 22.04 / 24.04 / 26.04.
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates build-essential cmake python3 dpkg-dev fakeroot binutils
      - uses: actions/checkout@v4
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENCONV_BUILD_TESTS=OFF -DOPENCONV_DOWNLOAD_DIR="$PWD/downloads"
          cmake --build build
          cmake --install build --prefix dist
      - name: Tarball
        run: bash scripts/package_posix.sh dist "$VERSION" out
      - name: Debian package (system-wide)
        env:
          DXR_DEB_MAX_GLIBC: "2.35"
        run: bash scripts/package_deb.sh dist "$VERSION" out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            out/*.tar.gz
            out/*.deb
          if-no-files-found: error

  # The released .deb installs next to the released runtime .deb on every supported release.
  deb-install:
    name: deb-install (Ubuntu ${{ matrix.release }})
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['22.04', '24.04', '26.04']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: out
      - name: Fetch the latest released runtime .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo DisplayXR/displayxr-runtime --pattern 'displayxr-runtime_*_amd64.deb' --dir runtime-deb
      - name: apt install + ldd -r + discovery in clean ubuntu:${{ matrix.release }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w "ubuntu:${{ matrix.release }}" \
            ./scripts/verify_deb_install_linux.sh out/*.deb runtime-deb/*.deb

  release:
    needs: [windows, linux, deb-install]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -l assets
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false

  # Tell displayxr-runtime to bump versions.json[conversion_open] to this tag, the way the
  # Leia conversion provider does for `leia_conversion` and the Leia SR plug-in for
  # `leia_plugin`. "Released = tested": a tag here means this build is meant for the dev
  # orchestrator and the bundle. Needs `release`, so the runtime side always finds the
  # assets. The App token is the org's publish bot (org secrets DISPLAYXR_APP_ID /
  # DISPLAYXR_APP_PRIVATE_KEY); GITHUB_TOKEN is not used. Forks skip it. Before this job
  # existed (v0.2.0 to v0.2.2) the bump was dispatched by hand:
  #   gh workflow run versions-bump.yml -R DisplayXR/displayxr-runtime \
  #     -f field=conversion_open -f tag=vX.Y.Z -f source_repo=DisplayXR/displayxr-conversion-open
  dispatch-versions-bump:
    if: github.repository_owner == 'DisplayXR'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Mint dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DISPLAYXR_APP_ID }}
          private-key: ${{ secrets.DISPLAYXR_APP_PRIVATE_KEY }}
          owner: DisplayXR
          repositories: displayxr-runtime

      - name: Dispatch versions.json bump
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.dispatch-token.outputs.token }}
          repository: DisplayXR/displayxr-runtime
          event-type: versions-bump
          client-payload: |
            {
              "field":       "conversion_open",
              "tag":         "${{ github.ref_name }}",
              "source_repo": "${{ github.repository }}"
            }
